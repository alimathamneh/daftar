<!doctype html>
<!-- SmartThings sign-in comes back here (it only allows https), and this sends the browser on to the program on the
     computer, which swaps the one-time code for its own keys. Nothing is kept or sent anywhere else. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>ربط SmartThings</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f5f9;color:#1f2330;display:grid;place-items:center;min-height:100vh;margin:0}
.card{background:#fff;border-radius:14px;padding:24px;max-width:420px;margin:16px;box-shadow:0 2px 12px #0001;text-align:center}
a{display:inline-block;margin-top:12px;background:#5b5cf0;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none}</style></head>
<body><div class="card"><p id="msg">عم برجعك للبرنامج على الكمبيوتر…</p><a id="go" href="http://127.0.0.1:8765/">ارجع للبرنامج</a></div>
<script>
const q=new URLSearchParams(location.search),go=document.getElementById('go');
if(q.get('code')){
  go.href='http://127.0.0.1:8765/api/smartthings/callback?'+new URLSearchParams({code:q.get('code'),state:q.get('state')||''});
  location.replace(go.href);
}else{
  document.getElementById('msg').textContent='ما وصلت موافقة من SmartThings'+(q.get('error')?` (${q.get('error')})`:'')+'. ارجع للبرنامج وجرّب مرة ثانية.';
}
</script></body></html>
