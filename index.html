<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر البيت</title>
<meta name="theme-color" content="#5b5cf0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script>(function(){var t='auto';try{t=localStorage.getItem('hm-theme')||'auto'}catch(e){}
  document.documentElement.dataset.theme=(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'})();</script>
<style>
@font-face{font-family:Plex;font-weight:400;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E}
@font-face{font-family:Plex;font-weight:700;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E}
@font-face{font-family:Plex;font-weight:400;src:url(fonts/ibm-plex-sans-arabic-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Plex;font-weight:700;src:url(fonts/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
:root{--bg:#f4f6fa;--card:#fff;--text:#141b2d;--muted:#6b7488;--border:#e6e9f0;--brand:#5b5cf0;--soft:#eef0ff;--green:#0c8459;--red:#c43a52;--amber:#bd700c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Plex,-apple-system,"SF Arabic",Tahoma,sans-serif;font-size:15px;line-height:1.55}
body{padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:21px;margin:0}h2{font-size:17px;margin:0 0 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top small{display:block;color:var(--muted);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;background:#e6f6ef;color:var(--green)}
.chip.off{background:#fff2df;color:var(--amber)}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--border);background:#fff;display:grid;place-items:center}
.card{background:var(--card);border:1px solid #e8ebf2;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 2px 10px rgba(16,24,40,.035)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.action{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 14px;border-radius:18px;border:1px solid #e8ebf2;background:#fff;text-align:start;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.action b{font-size:15px}.action small{color:var(--muted);font-size:12px}
.ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.ocrbtn{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;font-weight:700;color:#4646c9;background:var(--soft);border-radius:10px;padding:7px 11px;align-self:flex-start}
.ocrbtn input{display:none}
.field input.ocr{border-color:#f0b84b;background:#fffaf0}
.zoom{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:grid;place-items:center;overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.zoom img{max-width:none;width:180%;touch-action:pinch-zoom}
.syncbar{display:flex;align-items:center;gap:10px;background:#fff7e6;border:1px solid #f0d7aa;color:#8c5a0a;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;font-weight:600}
.syncbar span{flex:1}.syncbar .btn{width:auto;min-height:38px;padding:6px 14px;font-size:13.5px}
.a-gas{grid-column:1/-1;flex-direction:row;align-items:center}.a-gas .ai{background:#ffe9e0}
html[data-theme="dark"] .a-gas .ai{background:#3a2016}
.a-shop{grid-column:1/-1;flex-direction:row;align-items:center}.a-shop .ai{background:#fff1e6}
.shop-add{display:flex;gap:8px;margin-bottom:10px}.shop-add input{min-height:46px;border:1px solid #dfe3ec;border-radius:12px;padding:10px 12px;font-size:16px;min-width:0}
.shop-add .n{flex:2}.shop-add .q{flex:1}.shop-add .btn{width:auto;padding:0 16px}
.shop-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #eef1f5}.shop-row:last-child{border-bottom:0}
.shop-row label{flex:1;display:flex;align-items:center;gap:12px;font-size:16px;min-width:0}.shop-row input{width:26px;height:26px;accent-color:var(--brand);flex:none}
.shop-row small{color:var(--muted);font-size:13px}.shop-row.done span{text-decoration:line-through;color:var(--muted)}
.shop-row button{border:0;background:none;font-size:18px;padding:4px 6px;color:var(--muted)}.shop-row .star.on{color:#e0a106}
.a-view{grid-column:1/-1;flex-direction:row;align-items:center}.a-view .ai{background:#eef0ff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid #e8ebf2;border-radius:14px;padding:11px 12px}.kpi small{display:block;color:var(--muted);font-size:12px}.kpi b{font-size:17px}
.kpi.wide{grid-column:1/-1}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eef1f5;font-size:14.5px;width:100%;background:none;border-top:0;border-inline:0;text-align:start}
.line:last-child{border-bottom:0}.line .grow{flex:1;min-width:0}.line .grow span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line small{color:var(--muted);font-size:12px}.line b{white-space:nowrap}
.line.gone .grow span,.line.gone b{text-decoration:line-through;opacity:.55}
.st.part{background:#edf4ff;color:#2563a8}.st.edit{background:#eef0ff;color:#4646c9}.st.no{background:#f1f3f6;color:#6b7488}
.sub{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 6px}
.a-exp .ai{background:#f1edff}.a-el .ai{background:#fff3df}.a-wa .ai{background:#e6f2ff}.a-pay .ai{background:#e6f6ef}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:10px 16px;border-radius:13px;border:0;font-weight:700;background:var(--brand);color:#fff;width:100%}
.btn.white{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn.soft{background:var(--soft);color:#4646c9}
.btn.danger{background:#fff1f3;color:var(--red)}
.btn:disabled{opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.busy{opacity:.85;pointer-events:none}
.btn.busy::before,.chip.busy::before{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-inline-end-color:transparent;animation:spin .7s linear infinite;flex:none}
.chip.busy::before{width:11px;height:11px;border-width:2px}
.chip.busy{background:var(--soft);color:#4646c9}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:#4b5568}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid #dfe3ec;border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
.field textarea{min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#8f90f5;box-shadow:0 0 0 4px rgba(91,92,240,.14)}
.hint{font-size:12.5px;color:var(--muted)}.warn{font-size:12.5px;color:var(--amber)}
.seg{display:flex;background:#eef0f5;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.check{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--brand)}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.photos img{width:74px;height:74px;object-fit:cover;border-radius:12px;border:1px solid var(--border)}
.ph{position:relative}.ph button{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#141b2d;color:#fff;font-size:13px}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;min-height:74px;border:1.5px dashed #cdd3e1;border-radius:14px;color:#4b5568;font-weight:700;background:#fafbfd;margin-bottom:12px}
.pick input{display:none}
.list .it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eef1f5}
.list .it:last-child{border-bottom:0}
.it .ai{width:38px;height:38px;font-size:18px;flex:none}
.it .grow{flex:1;min-width:0}.it b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it small{color:var(--muted);font-size:12px}
.st{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st.wait{background:#fff2df;color:var(--amber)}.st.done{background:#e6f6ef;color:var(--green)}
.del{border:0;background:none;color:var(--red);font-size:20px;padding:4px 6px}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom));z-index:10}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#141b2d;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;z-index:20;max-width:calc(100vw - 32px);text-align:center;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}.toast.err{background:#9d2438}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:13.5px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.steps{padding-inline-start:20px;margin:6px 0 12px;font-size:13.5px}.steps li{margin-bottom:6px}
/* Dark mode (Settings: automatic / light / dark) */
html[data-theme="dark"]{color-scheme:dark;--bg:#0f1220;--card:#171b2d;--text:#e6e9f2;--muted:#98a1b8;--border:#2a3048;--soft:#262a52;--brand:#7273ff;--green:#3fcf8e;--red:#ff6b7f;--amber:#f2b445}
html[data-theme="dark"] :is(.card,.action,.icon-btn,.kpi,.btn.white,.field input,.field select,.field textarea,.shop-add input,.seg button.on){background-color:var(--card);border-color:var(--border);color:var(--text)}
html[data-theme="dark"] .seg{background:#12162a}
html[data-theme="dark"] :is(.line,.list .it,.shop-row){border-color:var(--border)}
html[data-theme="dark"] .pick{background:#12162a;border-color:#3a4160;color:#c9cfe0}
html[data-theme="dark"] .field label{color:#b4bcd0}
html[data-theme="dark"] .btn.soft{background:var(--soft);color:#b9baff}
html[data-theme="dark"] .btn.danger{background:#3a1820;color:#ff8597}
html[data-theme="dark"] .chip{background:#123426;color:#5fe0a5}.chip.off{background:#3a2a10}
html[data-theme="dark"] .st.wait{background:#3a2a10;color:#f2c879}html[data-theme="dark"] .st.done{background:#123426;color:#5fe0a5}
html[data-theme="dark"] .st.part{background:#162a45;color:#8fc0f5}html[data-theme="dark"] .st.edit{background:var(--soft);color:#b9baff}html[data-theme="dark"] .st.no{background:#262b40;color:#b4bcd0}
html[data-theme="dark"] .syncbar{background:#2e2412;border-color:#5a4520;color:#f2c879}
html[data-theme="dark"] :is(.a-exp .ai,.a-view .ai){background:#262a52}html[data-theme="dark"] .a-el .ai{background:#3a2a10}html[data-theme="dark"] .a-wa .ai{background:#16304d}
html[data-theme="dark"] .a-pay .ai{background:#123426}html[data-theme="dark"] .a-shop .ai{background:#35241a}
html[data-theme="dark"] .field input.ocr{background:#2e2412;border-color:#8a6a22}
html[data-theme="dark"] .ocrbtn{color:#b9baff}
html[data-theme="dark"] code{background:#262b40}
code{direction:ltr;unicode-bidi:isolate;background:#eef0f5;border-radius:6px;padding:1px 5px;font-size:12.5px;word-break:break-all}
</style>
</head>
<body>
<div id="home">
  <div class="top">
    <div><h1>دفتر البيت</h1><small id="catInfo">—</small></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="chip" id="net" data-net>متصل</span><button class="icon-btn" id="openSettings" aria-label="الإعدادات">⚙️</button></div>
  </div>
  <div class="syncbar hidden" id="syncBar"><span id="syncText"></span><button class="btn" id="syncBtn"></button></div>
  <div class="actions">
    <button class="action a-exp" data-form="expense"><span class="ai">🧾</span><b>مصروف</b><small>جديد أو دفعة</small></button>
    <button class="action a-el" data-form="electricity"><span class="ai">⚡</span><b>قراءة كهرباء</b><small>مع صورة العداد</small></button>
    <button class="action a-wa" data-form="water"><span class="ai">💧</span><b>قراءة مياه</b><small>مع صورة العداد</small></button>
    <button class="action a-pay" data-form="payment"><span class="ai">💳</span><b>دفعة قسط</b><small>أو دين</small></button>
    <button class="action a-gas" id="openGas"><span class="ai">🔥</span><b>الغاز</b><small id="gasInfo">متى بدّلت الجرة</small></button>
    <button class="action a-shop" id="openShop"><span class="ai">🛒</span><b>الأغراض</b><small id="shopInfo">قائمة التسوّق</small></button>
    <button class="action a-view" id="openView"><span class="ai">📊</span><b>عرض بياناتي</b><small>شوف، عدّل أو احذف</small></button>
  </div>
  <div class="card">
    <div class="row" style="align-items:center;margin-bottom:6px"><h2 style="margin:0">التسجيلات</h2><span class="hint" id="pendingInfo" style="text-align:left"></span></div>
    <div class="list" id="list"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="uploadBtn">⬆️ ارفع على Drive</button>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn white" id="refreshBtn">🔄 تحديث القوائم من Drive</button></div>
  </div>
  <p class="hint" style="text-align:center">بتشتغل بدون نت. ارفع لما يصير عندك إنترنت، وبعدين ضيفهم من البرنامج عالكمبيوتر.</p>
</div>

<div class="sheet hidden" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
// ---------- small helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const money=v=>`${Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:3})} JOD`;
const dmy=s=>{const p=String(s||'').slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:'—'};
function toast(msg,err=false){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',3200)}
const TYPES={expense:{icon:'🧾',name:'مصروف',cls:'a-exp'},electricity:{icon:'⚡',name:'قراءة كهرباء',cls:'a-el'},water:{icon:'💧',name:'قراءة مياه',cls:'a-wa'},payment:{icon:'💳',name:'دفعة قسط',cls:'a-pay'},edit:{icon:'✏️',name:'تعديل',cls:'a-view'},gas:{icon:'🔥',name:'تبديل جرة',cls:'a-gas'},delete:{icon:'🗑',name:'حذف',cls:'a-view'}};

// ---------- IndexedDB: entries (with photo blobs) and settings ----------
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('home-monthly-phone',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('entries',{keyPath:'id'});r.result.createObjectStore('kv')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(store,mode,fn){const db=await dbp;return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&'result' in out?out.result:out);t.onerror=()=>rej(t.error)})}
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const kvDel=k=>tx('kv','readwrite',s=>s.delete(k));
const allEntries=()=>tx('entries','readonly',s=>s.getAll());
const putEntry=e=>tx('entries','readwrite',s=>s.put(e));
const delEntry=id=>tx('entries','readwrite',s=>s.delete(id));
// Ask Safari to keep this app's data even when the phone is short on space.
navigator.storage?.persist?.().catch(()=>{});

// ---------- encryption: the same format as the computer (PBKDF2-SHA256 600k + AES-GCM) ----------
const HEADER=new TextEncoder().encode('HOME_MONTHLY_AESGCM_V1:');
const b64e=bytes=>{let s='';const b=new Uint8Array(bytes);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveRaw(pass,saltB64){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64d(saltB64),iterations:600000},base,256))}
const aesKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function encryptBytes(raw,data){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:HEADER},await aesKey(raw),data));
  const out=new Uint8Array(HEADER.length+12+ct.length);out.set(HEADER);out.set(iv,HEADER.length);out.set(ct,HEADER.length+12);return out}
async function decryptBytes(raw,data){const h=HEADER.length;if(new TextDecoder().decode(data.slice(0,h))!=='HOME_MONTHLY_AESGCM_V1:')throw new Error('format');
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(h,h+12),additionalData:HEADER},await aesKey(raw),data.slice(h+12)))}

// ---------- Google: sign in by redirect (works in Safari; the token lasts about an hour) ----------
// Shopping-only mode (someone else's phone) needs to see the folder shared with them, so it asks for Drive access;
// the full notebook keeps the narrower "files this app made" access.
let MODE='full',MYNAME='';
const SCOPE_FULL='https://www.googleapis.com/auth/drive.file',SCOPE_SHOP='https://www.googleapis.com/auth/drive';
// Always the folder address (".../" not ".../index.html"), so it matches the one redirect URI saved in Google Cloud.
const appUrl=()=>location.origin+location.pathname.replace(/index\.html$/,'');
async function signIn(next){const cid=await kvGet('client_id');if(!cid){openSettings();return toast('حط رقم Google Client ID بالإعدادات أول',true)}
  const state=crypto.getRandomValues(new Uint32Array(2)).join('-');await kvSet('oauth',{state,next});
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:cid,redirect_uri:appUrl(),response_type:'token',scope:MODE==='shop'?SCOPE_SHOP:SCOPE_FULL,include_granted_scopes:'true',state})}
async function takeRedirect(){if(!location.hash.includes('access_token')&&!location.hash.includes('error='))return null;
  const h=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',appUrl());const saved=await kvGet('oauth');await kvDel('oauth');
  if(h.get('error'))return toast('ما تم الربط مع Google: '+h.get('error'),true),null;
  if(!saved||saved.state!==h.get('state'))return toast('رد Google غير متوقع، جرّب مرة ثانية',true),null;
  await kvSet('token',{value:h.get('access_token'),exp:Date.now()+(Number(h.get('expires_in')||3000)-120)*1000});return saved.next||null}
async function validToken(){const t=await kvGet('token');return t&&t.exp>Date.now()?t.value:null}
async function token(next){const t=await kvGet('token');if(t&&t.exp>Date.now())return t.value;await signIn(next);return null}
async function gapi(tok,url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+tok,...(opt.headers||{})}});
  if(r.status===401){await kvDel('token');throw Object.assign(new Error('انتهت جلسة Google'),{reauth:true})}
  if(!r.ok)throw new Error('Drive: '+r.status+' '+(await r.text()).slice(0,160));return r}
const q=s=>s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function findFolder(tok,name,parent){const query=`name = '${q(name)}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`+(parent?` and '${parent}' in parents`:'');
  const r=await gapi(tok,'https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({q:query,fields:'files(id,name)',pageSize:'10'}));return (await r.json()).files?.[0]?.id||null}
async function inboxFolder(tok){const root=await findFolder(tok,'Home Monthly System');const inbox=root&&await findFolder(tok,'Phone Inbox',root);
  if(!inbox)throw new Error('ما لقيت مجلد الآيفون على Drive. من البرنامج عالكمبيوتر افتح "من الآيفون" واضغط "تحديث" مرة أول.');return inbox}

// ---------- lists from the computer (encrypted catalog) ----------
let CAT=null;
// silent: the automatic run — no Google page, no password prompt, no messages unless something arrived.
async function refreshCatalog(silent=false){
  if(!navigator.onLine)return silent?null:toast('بدك إنترنت لتحديث القوائم',true);
  if(silent&&!(await kvGet('key')))return;
  const tok=silent?await validToken():await token('refresh');if(!tok)return;
  try{
    const inbox=await inboxFolder(tok);
    const r=await gapi(tok,'https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({q:`name = 'catalog-for-phone.json' and '${inbox}' in parents and trashed = false`,fields:'files(id,modifiedTime)',orderBy:'modifiedTime desc',pageSize:'1'}));
    const f=(await r.json()).files?.[0];if(!f)throw new Error('لسا ما في قوائم. اضغط "تحديث" من البرنامج عالكمبيوتر.');
    const wrap=await (await gapi(tok,`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json();
    let key=await kvGet('key');
    if(silent&&(!key||key.salt!==wrap.salt))return;
    if(!key||key.salt!==wrap.salt){const pass=prompt('اكتب كلمة تشفير المزامنة (نفس اللي بالبرنامج عالكمبيوتر):');if(!pass)return;
      toast('بجهّز المفتاح… لحظة');key={salt:wrap.salt,raw:await deriveRaw(pass,wrap.salt)}}
    let data;try{data=JSON.parse(new TextDecoder().decode(await decryptBytes(key.raw,b64d(wrap.payload))))}
    catch{await kvDel('key');throw new Error('كلمة التشفير غلط، جرّب مرة ثانية')}
    const changed=!CAT||CAT.generated_at!==data.generated_at;
    await kvSet('key',key);await kvSet('catalog',data);CAT=data;await pruneShopping();await dropDeleted();renderHome();if(!silent||changed)toast('تم تحديث القوائم ✓');
  }catch(e){if(e.reauth){if(!silent)signIn('refresh');else renderHome()}else if(!silent)toast(e.message,true)}
}

// ---------- upload: one encrypted file per entry; the computer decides what to add ----------
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
let uploading=false;
async function upload(silent=false){
  if(uploading)return;
  const pending=(await allEntries()).filter(e=>!e.uploaded_at);
  if(!pending.length)return silent?null:toast('ما في شي جديد للرفع');
  if(!navigator.onLine)return silent?null:toast('بدك إنترنت للرفع',true);
  const key=await kvGet('key');if(!key)return silent?null:toast('اضغط "تحديث القوائم" أول عشان تدخل كلمة التشفير',true);
  const tok=silent?await validToken():await token('upload');if(!tok)return renderHome();
  uploading=true;const btn=$('#uploadBtn');btn.disabled=true;let done=0;
  try{
    const inbox=await inboxFolder(tok);
    for(const e of pending){
      btn.textContent=`⬆️ برفع ${done+1} من ${pending.length}…`;
      const photos=[];for(const p of e.photos||[])photos.push({name:p.name,type:p.blob.type||'image/jpeg',data:await blobB64(p.blob)});
      const body={id:e.id,type:e.type,created_at:e.created_at,period_id:e.period_id,period_label:e.period_label,device:'iPhone',data:e.type==='shopping'?{ops:Object.values(e.data.ops||{})}:e.data,photos};
      const payload=b64e(await encryptBytes(key.raw,new TextEncoder().encode(JSON.stringify(body))));
      const meta={name:`phone-${e.id}.json`,parents:[inbox],mimeType:'application/json'};
      const boundary='hm'+Math.random().toString(36).slice(2);
      const multipart=new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n`,
        JSON.stringify({format:'home-monthly-phone-entry',id:e.id,payload}),`\r\n--${boundary}--`]);
      await gapi(tok,'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body:multipart});
      // Keep a light copy for the list; the photos are on Drive now.
      e.uploaded_at=new Date().toISOString();e.photo_count=(e.photos||[]).length;e.photos=[];await putEntry(e);done++;
    }
    toast(`تم رفع ${done} ✓ ضيفهم من البرنامج عالكمبيوتر`);
  }catch(err){if(err.reauth&&silent){if(done)toast(`تم رفع ${done} ✓`)}else{toast((done?`انرفع ${done}. `:'')+err.message,true);if(err.reauth)signIn('upload')}}
  finally{uploading=false;btn.disabled=false;renderHome()}
}
// Automatic: upload, then fresh lists — when the app opens, when the internet comes back, and right after saving.
let lastAuto=0;
async function autoSync(force=false){
  if(!navigator.onLine||(!force&&Date.now()-lastAuto<20000))return;lastAuto=Date.now();
  if(MODE==='shop')return withBusy(null,()=>sharedSync());
  await withBusy(null,async()=>{await upload(true);await refreshCatalog(true)});
}

// ---------- months, lists and labels ----------
function monthLabel(s){if(!s)return '—';const y0=+s.slice(0,4),m0=+s.slice(5,7),day=+s.slice(8,10),start=CAT?.month_start_day||25;let y=y0,m=m0;if(day>=start){m++;if(m>12){m=1;y++}}return `${String(m).padStart(2,'0')}/${y}`}
const openPeriods=()=>(CAT?.periods||[]).filter(p=>p.status!=='closed');
function periodSelect(id='fPeriod'){const ps=openPeriods();if(!ps.length)return `<div class="warn" style="margin-bottom:12px">ما في شهر مفتوح بالقوائم. حدّث القوائم من Drive، أو افتح شهر عالكمبيوتر.</div><input type="hidden" id="${id}" value="">`;
  return `<div class="field"><label>الشهر</label><select id="${id}">${ps.map(p=>`<option value="${p.id}">${monthLabel(p.period_date)}</option>`).join('')}</select></div>`}
const periodLabel=id=>{const p=(CAT?.periods||[]).find(x=>String(x.id)===String(id));return p?monthLabel(p.period_date):''};

// ---------- photos: shrunk on the phone so uploads stay small ----------
async function shrink(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const max=1600,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.82))}catch{return file}finally{URL.revokeObjectURL(url)}}
let PHOTOS=[];
function photoBlock(label){return `<div class="field"><label>${label}</label><div class="photos" id="photoList"></div><label class="pick">📷 صوّر أو اختار صورة<input type="file" accept="image/*" multiple id="photoInput"></label></div>`}
// ---------- meter numbers from a photo (Tesseract.js, bundled in ocr/ and run on the phone) ----------
let OCR=null;
async function ocrWorker(){
  if(OCR)return OCR;
  if(!window.Tesseract)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='ocr/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.append(s)});
  OCR=Tesseract.createWorker('eng',1,{workerPath:'ocr/worker.min.js',corePath:'ocr/',langPath:'ocr/',gzip:true,workerBlobURL:false})
    .then(async w=>{await w.setParameters({tessedit_pageseg_mode:'11'});return w}).catch(e=>{OCR=null;throw e});
  return OCR;
}
async function readMeter(blob,previous,avgUse){
  const url=URL.createObjectURL(blob),img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
  // Black-and-white copy (threshold at the image's mean) so the digits stand out from the meter face.
  const draw=(invert,binary)=>{const c=document.createElement('canvas'),s=Math.min(1,700/img.naturalWidth);c.width=img.naturalWidth*s;c.height=img.naturalHeight*s;
    const g=c.getContext('2d');g.filter=`grayscale(1) contrast(1.6)${invert?' invert(1)':''}`;g.drawImage(img,0,0,c.width,c.height);
    if(binary){const d=g.getImageData(0,0,c.width,c.height),px=d.data;let sum=0;for(let i=0;i<px.length;i+=4)sum+=px[i];const mean=sum/(px.length/4);
      for(let i=0;i<px.length;i+=4){const v=px[i]>mean?255:0;px[i]=px[i+1]=px[i+2]=v}g.putImageData(d,0,0)}
    return c};
  // Digital meters have dark digits on light, drum meters light on black; each photo is read four ways and the readings pooled.
  const w=await ocrWorker(),found=[];
  for(const [inv,bin] of [[false,false],[true,false],[false,true],[true,true]]){const {data}=await w.recognize(draw(inv,bin));
    for(const word of data.words||[]){const t=(word.text||'').replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/\D/g,'');if(t.length>=3&&t.length<=8)
      found.push({n:Number(t),h:word.bbox.y1-word.bbox.y0,conf:word.confidence})}}
  URL.revokeObjectURL(url);if(!found.length)return null;
  const p=Number(previous),known=previous!=null&&previous!==''&&!isNaN(p);
  // A sensible reading is at or above the last one and not far beyond normal use.
  const room=Math.max(10*(Number(avgUse)||0),known?p*0.2:0,500);
  const fits=known?found.filter(x=>x.n>=p&&x.n-p<=room):found;
  const pool=fits.length?fits:known?[]:found;if(!pool.length)return null;
  // Big digits first (the counter is the largest text on the meter), then confidence.
  pool.sort((a,b)=>b.h-a.h||b.conf-a.conf);return pool[0].n;
}
function zoom(url){const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${url}" alt="">`;z.onclick=()=>z.remove();document.body.append(z)}

function drawPhotos(){const box=$('#photoList');if(!box)return;box.innerHTML=PHOTOS.map((p,i)=>`<span class="ph"><img src="${p.url}" alt="" data-zoom="${i}"><button type="button" data-rm="${i}">✕</button></span>`).join('');
  box.querySelectorAll('[data-zoom]').forEach(im=>im.onclick=()=>zoom(PHOTOS[+im.dataset.zoom].url));
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{URL.revokeObjectURL(PHOTOS[+b.dataset.rm].url);PHOTOS.splice(+b.dataset.rm,1);drawPhotos()})}
function bindPhotos(){const inp=$('#photoInput');if(!inp)return;inp.onchange=async()=>{const pick=inp.closest('.pick'),txt=pick.firstChild.textContent;pick.firstChild.textContent='⏳ بجهّز الصور… ';
  try{await addPhotos(inp)}finally{pick.firstChild.textContent=txt}}}
async function addPhotos(inp){{for(const f of inp.files){if(PHOTOS.length>=6){toast('بكفي 6 صور',true);break}const blob=await shrink(f);PHOTOS.push({blob,name:f.name||'photo.jpg',url:URL.createObjectURL(blob)})}inp.value='';drawPhotos()}}

// ---------- forms ----------
const sheet=$('#sheet');
function openSheet(html){sheet.innerHTML=html;sheet.classList.remove('hidden');$('#home').classList.add('hidden');window.scrollTo(0,0)}
function closeSheet(){PHOTOS.forEach(p=>URL.revokeObjectURL(p.url));PHOTOS=[];if(MODE==='shop')return shoppingScreen();sheet.classList.add('hidden');sheet.innerHTML='';$('#home').classList.remove('hidden');renderHome()}
const head=t=>`<div class="top"><h1>${t}</h1><button class="icon-btn" id="closeSheet" aria-label="رجوع">✕</button></div>`;
const val=id=>($('#'+id)?.value||'').trim();
const numv=id=>{const v=val(id);return v===''?null:Number(v)};

async function save(type,data,periodId){
  const e={id:crypto.randomUUID(),type,created_at:new Date().toISOString(),period_id:periodId?Number(periodId):null,period_label:periodId?periodLabel(periodId):'',data,photos:PHOTOS.map(p=>({blob:p.blob,name:p.name}))};
  await putEntry(e);closeSheet();toast(navigator.onLine?'انحفظ ✓ وبيترفع هلأ':'انحفظ على الآيفون ✓');autoSync(true);
}

   ${el?`<div class="field"><label>العداد الرئيسي الحالي</label><input id="fMain" type="number" inputmode="decimal" step="0.001">${prev('main_current')}</div>

    if(el){test('fMain','main_current','العداد الرئيسي',avg.main);test('fCar','car_current','عداد السيارة',avg.car);test('fRoof','roof_current','عداد الروف',avg.roof)}
    else test('fRoof','roof_current','عداد الروف',avg.water_roof);$('#readWarn').textContent=w.join(' · ')};
  sheet.querySelectorAll('input[type=number]').forEach(i=>i.addEventListener('input',check));

    b.innerHTML='📷 اقرأ الرقم من صورة<input type="file" accept="image/*" capture="environment">';inp.after(b);
    b.querySelector('input').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;

      :{record_date:val('fDate'),bill_date:val('fBill'),roof_current:numv('fRoof'),total_consumption:numv('fTotal'),invoice_amount:numv('fInvoice'),notes:val('fNotes')};

function paymentForm(){

async function roofImage(s){
  const W=900,rowH=58,rows=s.lines.length,H=180+rows*rowH+80,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  await document.fonts.ready;g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#5b5cf0';g.fillRect(0,0,W,120);
  g.direction='rtl';g.textAlign='right';g.fillStyle='#fff';g.font='700 40px Plex, sans-serif';g.fillText('كشف الروف',W-50,60);g.font='400 26px Plex, sans-serif';g.fillText(`شهر ${s.month}`,W-50,100);
  let y=180;for(const [a,b] of s.lines){if(b===''){g.fillStyle='#4646c9';g.font='700 28px Plex, sans-serif';g.textAlign='right';g.fillText(a,W-50,y);}
    else{g.fillStyle='#4b5568';g.font='400 26px Plex, sans-serif';g.textAlign='right';g.fillText(a,W-50,y);g.fillStyle='#141b2d';g.font='700 26px Plex, sans-serif';g.textAlign='left';
      // "56.762 JOD" reads left to right; "من 64 إلى 73" right to left.

    y+=rowH}

  g.textAlign='left';g.direction='ltr';g.fillText(s.total,60,y+30);

}

// ---------- shopping list (shared with the computer; last change wins, item by item) ----------
const shopEntries=async()=>(await allEntries()).filter(e=>e.type==='shopping');
// Shared mode: the list file the computer publishes, the changes file both phones write to, and our unsent changes.
let SHOPDATA=null,SHOPOPS=[];
async function sharedSync(interactive=false){
  if(!navigator.onLine)return;const tok=interactive?await token('shopsync'):await validToken();if(!tok)return renderShopHome();
  const ff=async(name,folder)=>{const r=await gapi(tok,'https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({q:`name = '${name}' and '${folder}' in parents and trashed = false`,fields:'files(id)',pageSize:'1'}));return (await r.json()).files?.[0]?.id};
  try{
    const folder=await findFolder(tok,'Home Monthly Shopping');if(!folder)throw new Error('ما لقيت مجلد الأغراض. لازم يشاركه معك صاحب البرنامج.');
    const listId=await ff('shopping-list.json',folder),inId=await ff('shopping-changes.json',folder);if(!inId)throw new Error('لسا الكمبيوتر ما جهّز القائمة. جرّب بعد دقيقتين.');
    let inbox={ops:[]};try{inbox=await (await gapi(tok,`https://www.googleapis.com/drive/v3/files/${inId}?alt=media`)).json()}catch{}
    const out=await kvGet('shopOut')||[];
    if(out.length){const seen=new Set(inbox.ops.map(o=>o.id+o.updated_at));inbox.ops=[...inbox.ops,...out.filter(o=>!seen.has(o.id+o.updated_at))].slice(-300);
      await gapi(tok,`https://www.googleapis.com/upload/drive/v3/files/${inId}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(inbox)});
      await kvSet('shopOut',[])}
    SHOPOPS=inbox.ops;await kvSet('shopOps',SHOPOPS);
    if(listId){SHOPDATA=await (await gapi(tok,`https://www.googleapis.com/drive/v3/files/${listId}?alt=media`)).json();await kvSet('shopData',SHOPDATA)}
  }catch(e){if(e.reauth){if(interactive)signIn('shopsync')}else if(interactive)toast(e.message,true)}
  renderShopHome();
}
async function shopView(){
  const map=new Map(),shared=MODE==='shop',base=shared?SHOPDATA:CAT?.shopping;
  for(const x of [...(base?.items||[]),...(base?.staples||[])])map.set(x.id,{...x});
  const ops=[];if(shared)ops.push(...SHOPOPS,...(await kvGet('shopOut')||[]));else for(const e of await shopEntries())ops.push(...Object.values(e.data.ops||{}));
  ops.sort((a,b)=>a.updated_at.localeCompare(b.updated_at));
  for(const op of ops){const cur=map.get(op.id);if(!cur||op.updated_at>=(cur.updated_at||'')){if(op.deleted)map.delete(op.id);else map.set(op.id,{...cur,...op})}}
  const all=[...map.values()];return {items:all.filter(x=>!x.staple).sort((a,b)=>(a.in_cart-b.in_cart)||b.updated_at.localeCompare(a.updated_at)),staples:all.filter(x=>x.staple)};
}
async function shopChange(list){
  if(MODE==='shop'){const out=await kvGet('shopOut')||[],now=new Date().toISOString();
    for(const op of list)out.push({...op,by:op.by||MYNAME,updated_at:now});await kvSet('shopOut',out);await shoppingScreen();withBusy(null,()=>sharedSync());return}
  // All changes waiting to go up live in one entry; an item changed twice keeps only its latest state.
  let e=(await shopEntries()).find(x=>!x.uploaded_at);
  if(!e)e={id:crypto.randomUUID(),type:'shopping',created_at:new Date().toISOString(),period_id:null,period_label:'',data:{ops:{}},photos:[]};
  for(const op of list)e.data.ops[op.id]={...op,updated_at:new Date().toISOString()};
  await putEntry(e);await shoppingScreen();autoSync(true);
}
// Uploaded changes stay on screen until the computer's list shows them (or for a day at most).
async function pruneShopping(){if(!CAT?.shopping)return;
  const have=new Map([...CAT.shopping.items,...CAT.shopping.staples].map(x=>[x.id,x]));
  for(const e of await shopEntries()){if(!e.uploaded_at)continue;
    const seen=Object.values(e.data.ops||{}).every(op=>{const x=have.get(op.id);return op.deleted?!x:x&&x.updated_at>=op.updated_at});
    if(seen||Date.now()-Date.parse(e.uploaded_at)>864e5)await delEntry(e.id)}}

async function gasState(){

  const mine=(await allEntries()).filter(e=>e.type==='gas'&&CAT?.inbox?.[e.id]!=='applied').map(e=>e.data);

  return list;
}

function applyTheme(){let t='auto';try{t=localStorage.getItem('hm-theme')||'auto'}catch{}

// A spinner on the button that started the work; the status chip also shows that Drive is being used.
let working=0;
async function withBusy(btn,fn,label){
  const old=btn?.innerHTML;if(btn){btn.classList.add('busy');if(label)btn.textContent=label}
  working++;net();
  try{return await fn()}finally{working--;net();if(btn&&btn.isConnected){btn.classList.remove('busy');if(label)btn.innerHTML=old}}
}
function net(){const on=navigator.onLine;document.querySelectorAll('[data-net]').forEach(c=>{c.textContent=working?'عم يتزامن':on?'متصل':'بدون نت';c.classList.toggle('off',!on&&!working);c.classList.toggle('busy',!!working)})}
addEventListener('online',net);addEventListener('offline',net);

document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{if(!CAT)toast('ما في قوائم لسا. حدّثها من Drive لما يصير عندك نت.',true);
  ({expense:expenseForm,electricity:()=>readingForm('electricity'),water:()=>readingForm('water'),payment:paymentForm})[b.dataset.form]()});
$('#openView').onclick=viewScreen;$('#openShop').onclick=shoppingScreen;$('#openGas').onclick=gasScreen;$('#uploadBtn').onclick=e=>withBusy(e.currentTarget,()=>upload());$('#syncBtn').onclick=e=>withBusy(e.currentTarget,()=>upload());
addEventListener('online',()=>autoSync(true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoSync()});$('#refreshBtn').onclick=e=>withBusy(e.currentTarget,()=>refreshCatalog(),'بحدّث القوائم…');$('#openSettings').onclick=openSettings;

(async()=>{
  net();CAT=await kvGet('catalog')||null;
  // A link ending in ?shop=1 sets the phone up for shopping only.
  const qs=new URLSearchParams(location.search);
  if(qs.get('cid')?.endsWith('.apps.googleusercontent.com')&&!(await kvGet('client_id')))await kvSet('client_id',qs.get('cid'));
  if(qs.get('shop')==='1'&&!(await kvGet('mode')))await kvSet('mode','shop');
  if(qs.has('shop')||qs.has('cid'))history.replaceState(null,'',appUrl());
  MODE=await kvGet('mode')||'full';MYNAME=await kvGet('myName')||'';
  if(MODE==='shop'){SHOPDATA=await kvGet('shopData');SHOPOPS=await kvGet('shopOps')||[];await shoppingScreen()}else await renderHome();
  const next=await takeRedirect();if(next==='upload')await upload();else if(next==='refresh')await refreshCatalog();else if(next==='shopsync')await withBusy(null,()=>sharedSync(true));
  autoSync(true);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
